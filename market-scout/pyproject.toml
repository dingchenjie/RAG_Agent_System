[project]
name = "market-scout"
version = "0.1.0"
description = "竞品调研 Agent：LangGraph 图编排 + ReAct + Multi-Agent + Browser Use + MCP + Langfuse 观测"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langfuse>=2.50",
    "playwright>=1.45",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
scout = "market_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["market_scout*"]
