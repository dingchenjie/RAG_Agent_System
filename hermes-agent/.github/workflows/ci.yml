name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check hermes tests scripts

      - name: Test with coverage
        run: pytest -q --cov=hermes --cov-report=term-missing --cov-fail-under=70

      - name: Offline eval gate
        run: python scripts/run_eval.py --fail-under 0.99
